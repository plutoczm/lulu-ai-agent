services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lulu_ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-lulu_ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lulu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lulu_ai_agent} -d ${POSTGRES_DB:-lulu_ai_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lulu_ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-lulu_ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_AUTH_SECURE_COOKIE: "true"
      APP_AUTH_SESSION_DAYS: "30"
      LULU_PROJECT_ROOT: /app
      MODEL_ROUTE_MEMORY: ${MODEL_ROUTE_MEMORY:-dashscope,deepseek}
      MCP_ENABLED: "false"
      CODEX_COMMAND: /bin/false
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8123"

  frontend:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

volumes:
  lulu_pg_data:
